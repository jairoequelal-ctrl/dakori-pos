<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DAKORI Admin - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {

            width: 100%;
            max-width: 420px;

            background: white;

            border-radius: 22px;

            padding: 32px;

            border: 1px solid #eadfd8;

            box-shadow:
                0 15px 40px
                rgba(23,48,75,.12);

        }

        .login-logo {

            text-align: center;

            margin-bottom: 28px;

        }

        .login-logo h1 {

            margin: 0;

            color: #17304b;

            font-size: 2rem;

        }

        .login-logo p {

            margin: 8px 0 0;

            color: #777;

        }

        .login-group {

            margin-bottom: 16px;

        }

        .login-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: 700;

            color: #17304b;

        }

        .login-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 12px;

            font: inherit;

        }

        .login-btn {

            width: 100%;

            border: none;

            background: #c7363d;

            color: white;

            padding: 14px;

            border-radius: 12px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 8px;

        }

        .login-btn:disabled {

            opacity: .5;

            cursor: not-allowed;

        }

        .login-error {

            display: none;

            margin-top: 18px;

            background: #fff0f0;

            color: #a12626;

            padding: 12px;

            border-radius: 10px;

            font-size: .9rem;

        }

        .back-pos {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #17304b;

            text-decoration: none;

            font-weight: 700;

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-logo">

        <h1>DAKORI</h1>

        <p>
            Panel de administración
        </p>

    </div>


    <form id="loginForm">


        <div class="login-group">

            <label for="email">
                Correo
            </label>

            <input
                id="email"
                type="email"
                autocomplete="username"
                required
            >

        </div>


        <div class="login-group">

            <label for="password">
                Contraseña
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            class="login-btn"
            id="loginBtn"
            type="submit"
        >
            Iniciar sesión
        </button>


        <div
            class="login-error"
            id="loginError"
        ></div>


    </form>


    <a
        class="back-pos"
        href="index.html"
    >
        ← Volver al POS
    </a>


</div>


<script src="login.js"></script>


</body>

</html>
