<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DAKORI POS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="topbar">

    <div>

        <h1>
            DAKORI POS
        </h1>

        <p>
            Sistema de pedidos
        </p>

    </div>


    <div class="order-number">

        Orden

        <span id="orderNumber">
            #001
        </span>

    </div>

</header>


<main class="app">


    <!-- PRODUCTOS -->

    <section class="catalog">

        <div
            class="category-tabs"
            id="categoryTabs"
        ></div>


        <div
            class="products-grid"
            id="productsGrid"
        ></div>

    </section>


    <!-- CARRITO -->

    <aside class="cart-panel">


        <div class="cart-header">

            <div>

                <h2>
                    Pedido actual
                </h2>

                <p id="cartStatus">

                    Agrega productos para comenzar

                </p>

            </div>


            <button
                class="ghost-btn"
                id="clearCartBtn"
            >
                Vaciar
            </button>

        </div>


        <div
            class="cart-items"
            id="cartItems"
        ></div>


        <div class="cart-summary">


            <div class="summary-line">

                <span>
                    Subtotal
                </span>

                <strong id="subtotal">
                    $0.00
                </strong>

            </div>


            <div class="summary-line total-line">

                <span>
                    TOTAL
                </span>

                <strong id="total">
                    $0.00
                </strong>

            </div>


            <!-- MOMENTO DE PAGO -->

            <label
                class="payment-label"
                for="paymentMoment"
            >
                ¿Cuándo pagará?
            </label>


            <select id="paymentMoment">

                <option value="Antes">
                    Pagar ahora
                </option>

                <option value="Después">
                    Pagar después de comer
                </option>

            </select>


            <!-- MÉTODO DE PAGO -->

            <div id="paymentMethodContainer">

                <label
                    class="payment-label"
                    for="paymentMethod"
                >
                    Método de pago
                </label>


                <select id="paymentMethod">

                    <option value="Efectivo">
                        Efectivo
                    </option>

                    <option value="Transferencia">
                        Transferencia
                    </option>

                    <option value="Tarjeta">
                        Tarjeta
                    </option>

                </select>

            </div>


            <button
                class="finish-btn"
                id="finishOrderBtn"
            >
                Registrar pedido
            </button>


        </div>

    </aside>

</main>


<!-- HISTORIAL -->

<section class="history-section">


    <div class="history-header">

        <div>

            <h2>
                Historial de pedidos
            </h2>

            <p>
                Pedidos registrados en el sistema.
            </p>

        </div>


        <button
            class="ghost-btn"
            id="clearHistoryBtn"
            disabled
        >
            Historial online
        </button>

    </div>


    <div class="history-table-wrap">


        <table>


            <thead>

                <tr>

                    <th>
                        Orden
                    </th>

                    <th>
                        Hora
                    </th>

                    <th>
                        Productos
                    </th>

                    <th>
                        Pedido
                    </th>

                    <th>
                        Pago
                    </th>

                    <th>
                        Total
                    </th>

                </tr>

            </thead>


            <tbody id="historyBody">

            </tbody>


        </table>


    </div>


</section>


<div
    class="toast"
    id="toast"
></div>


<script src="app.js"></script>


</body>

</html>
